name: QuizIsland
options:
  bundleIdPrefix: com.ran.quizisland
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  QuizIsland:
    type: application
    platform: iOS
    sources:
      - path: QuizIsland
    dependencies:
      - target: QuizIslandWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ran.quizisland.app
        INFOPLIST_FILE: QuizIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuizIsland/QuizIsland.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_LIVE_ACTIVITIES: YES

  QuizIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: QuizIslandWidget
      - path: QuizIsland/Models/QuizAttributes.swift
      - path: QuizIsland/Intents/IslandPaginationIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ran.quizisland.app.widget
        INFOPLIST_FILE: QuizIslandWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuizIslandWidget/QuizIslandWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
